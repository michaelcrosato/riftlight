name: Claude Review

# Automated code review, once per PR. Autopilot merges PRs within seconds, so:
#   - merged PR (the usual case: Autopilot dispatches this after each merge): blocking
#     findings become one issue labeled `claude`, which Claude then fixes. Nothing is
#     posted on the merged PR. No blocking findings, no issue.
#   - open PR (on `hold`, or dispatched by hand): findings land as inline comments, which
#     the authoring agent (cloud session or @claude) addresses.
# Skips itself when neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set.
# Alternative with no workflow to maintain: enable Code Review at claude.ai/admin-settings.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
  pull_request:
    types: [labeled, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # pull_request: only PRs held open with the `hold` label (other PRs are reviewed
    # after Autopilot merges them).
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'hold') &&
        (github.event.action != 'labeled' || github.event.label.name == 'hold'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Open or merged?
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          echo "mode=skip" >> "$GITHUB_OUTPUT"
          if [ "$HAS_CLAUDE" != "true" ]; then
            echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret; skipping review."; exit 0
          fi
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::Not a PR number: $PR"; exit 1; }
          state=$(gh pr view "$PR" --json state --jq .state)
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          case "$state" in
            OPEN) echo "mode=comment" >> "$GITHUB_OUTPUT" ;;
            MERGED) echo "mode=issue" >> "$GITHUB_OUTPUT" ;;
            *) echo "PR #$PR is $state; nothing to review." ;;
          esac

      - if: steps.pr.outputs.mode != 'skip'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Review the open PR (inline comments)
        if: steps.pr.outputs.mode == 'comment'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude's own pushes/PRs must be able to trigger this (PR opened by a bot).
          allowed_bots: "claude,github-actions,dependabot"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ steps.pr.outputs.number }}"
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment"

      - name: Review the merged PR (findings to a file)
        if: steps.pr.outputs.mode == 'issue'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "claude,github-actions,dependabot"
          prompt: |
            Review pull request #${{ steps.pr.outputs.number }} in ${{ github.repository }}. It is
            already merged; the checkout is the default branch with the change in it. Read the
            diff with `gh pr diff ${{ steps.pr.outputs.number }}` and the PR with
            `gh pr view ${{ steps.pr.outputs.number }}`, and the code around it. Follow AGENTS.md.

            Look only for blocking problems: bugs that break behavior, security issues, data
            loss, broken builds, tests or docs commands, and violations of the hard constraints
            in AGENTS.md. Skip style, naming and nice-to-haves. Verify each finding against the
            code before you report it.

            If there is at least one blocking finding, write review-findings.md: one section
            per finding with `path:line`, what is wrong, and the concrete fix. Otherwise do not
            create the file. Do not comment on the PR or open issues yourself.
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --max-turns 60
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep,Write"

      - name: Open an issue for blocking findings
        if: steps.pr.outputs.mode == 'issue' && hashFiles('review-findings.md') != ''
        env:
          # With AUTOMATION_TOKEN the issue triggers Claude right away (claude.yml); with
          # GITHUB_TOKEN it waits for the weekly maintenance sweep or a human.
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          title=$(gh pr view "$PR" --json title --jq .title)
          {
            echo "Claude Review found blocking problems in #$PR after it merged. Fix them on a \`claude/*\` branch."
            echo
            cat review-findings.md
          } > issue-body.md
          gh issue create --title "Review findings: $title (#$PR)" --label claude --body-file issue-body.md
