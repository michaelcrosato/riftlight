name: Claude CI Autofix

# When CI fails on a PR branch, Claude diagnoses it and pushes a fix to that branch.
# When CI fails on the default branch, Claude opens a fix PR.
# Pushes go out as the Claude GitHub App, so CI re-runs on the fix.
# Gives up after 3 consecutive autofix commits on a branch.
#
# Security: runs branch code with write permissions. Fine for a repo where every
# writer is trusted (this one); fork PRs are excluded below.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: ci-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  autofix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Check branch is still at the failing commit, and attempt budget
        id: guard
        env:
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$FAILED_SHA" ]; then
            echo "Branch moved past the failing commit; a newer CI run will decide."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          attempts=$(git log -3 --format=%s | grep -c '\[ci-autofix\]' || true)
          if [ "$attempts" -ge 3 ]; then
            echo "::warning::3 consecutive autofix attempts; stopping so a human can look."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Fix with Claude
        if: steps.guard.outputs.go == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude's own pushes/PRs must be able to trigger this (CI failed on Claude's commit, PR opened by a bot).
          allowed_bots: "claude,github-actions,dependabot"
          prompt: |
            /fix-ci
            Repository: ${{ github.repository }}
            Failed run: ${{ github.event.workflow_run.html_url }}
            Run ID: ${{ github.event.workflow_run.id }}
            Branch: ${{ github.event.workflow_run.head_branch }}
            Default branch: ${{ github.event.repository.default_branch }}
            PR number: ${{ github.event.workflow_run.pull_requests[0].number || 'none' }}
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --max-turns 100
            --allowedTools "Bash,Edit,Write,MultiEdit,Read,Glob,Grep,WebFetch,WebSearch"
