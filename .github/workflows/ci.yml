name: CI

# One run per change, never a required status check (merges don't wait for CI):
#   push              every branch. Autopilot merges a PR within seconds and then cancels its
#                     branch run, so the run that counts for a merged PR is the one on main.
#                     A held or draft PR keeps its branch run.
#   workflow_dispatch Autopilot dispatches CI on main after each merge: a merge made with the
#                     default GITHUB_TOKEN fires no push event, so main would get no run.
# No pull_request trigger: it would test the same commit a second time.
# A red run on main is reverted automatically by this workflow's revert-red-main job.

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Branches: a newer push supersedes the old run. main: every merge gets its own verdict,
  # so auto-revert blames the right commit.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - name: Install Node deps
        if: hashFiles('package.json') != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then corepack enable && yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci --no-audit --no-fund
          else npm install; fi

      - name: Set up uv
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        uses: astral-sh/setup-uv@v7
      - name: Install Python deps
        if: hashFiles('pyproject.toml') != ''
        run: uv sync

      - name: Set up Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install lint tools (shellcheck, pinned actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c --quiet -
          sudo tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C /usr/local/bin actionlint

      - run: scripts/check.sh

  e2e:
    # Real-browser verification (scripts/e2e.mjs): WebGPU (SwiftShader Vulkan) in Chromium's
    # headless shell, no display (scripts/browser.mjs), a browser without WebGPU told so, and the
    # agent tools. The suites run as parallel groups (GROUPS in scripts/e2e.mjs); the slowest
    # one sets the wall time.
    name: e2e (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: ["@core", "@cameras", "@filters", "@world", "@assets", "@assets-2", "@assets-3"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-headless-shell
      - name: Install Chromium (its headless shell)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install --with-deps --only-shell chromium
      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright-core install-deps chromium
      - run: npm run build
      - run: npm run test:e2e -- "${{ matrix.group }}"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-frames-${{ strategy.job-index }}
          path: .scratch/e2e/
          if-no-files-found: ignore

  revert-red-main:
    # CI failed on main: revert the commit that turned it red (scripts/ci/revert-red-main.sh).
    # It runs here, not in a workflow_run workflow: GitHub doesn't fire workflow_run for the
    # runs Autopilot dispatches with GITHUB_TOKEN.
    needs: [check, e2e]
    if: failure() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write # re-run CI on main after the revert
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - run: scripts/ci/revert-red-main.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  release:
    # The engine kit as a GitHub Release, one per engine version (README.md, "Handing the engine
    # to another agent"): once main's check and e2e pass, the run for main's newest commit
    # publishes package.json's version if it has no release yet: engine-v<version>, holding
    # bundle/pixel-engine.zip (npm run bundle) with its CHANGELOG.md section as the notes
    # (scripts/release/notes.mjs). Only the newest commit's run publishes, so a re-run of an older
    # one (a version since reverted among them) never does; a version superseded on main before
    # its CI passed is skipped, and a later run with the same version catches up one an earlier run
    # left. It is a job here for the reason revert-red-main is. A failed release leaves the run's
    # verdict alone (continue-on-error: revert-red-main judges a commit by its parent's run) and
    # opens an issue; the next run on main tries again.
    needs: [check, e2e]
    if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
      issues: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # npm's install scripts and the build never see the write token
      - name: The version, and whether this run publishes it
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tip=$(gh api "repos/$GH_REPO/commits/$BASE" --jq .sha)
          draft=$(gh release view "engine-v$version" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$BASE is at ${tip:0:7} now, not ${GITHUB_SHA:0:7}: the run for it publishes"
          elif [ "$draft" = "false" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "engine-v$version is already released"
          else
            # a draft is what a cancelled run left between creating and publishing: start again
            if [ "$draft" = "true" ]; then gh release delete "engine-v$version" --yes; fi
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.v.outputs.new == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.v.outputs.new == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.v.outputs.new == 'true'
        run: npm run bundle
      - name: Publish engine-v${{ steps.v.outputs.version }}
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # the zip unpacks to pixel-engine/, as README.md's download line says
          entries=$(unzip -Z1 bundle/pixel-engine.zip)
          outside=$(printf '%s\n' "$entries" | grep -cv '^pixel-engine/' || true)
          if [ "$outside" != 0 ]; then echo "::error::bundle/pixel-engine.zip holds $outside entries outside pixel-engine/"; exit 1; fi
          node scripts/release/notes.mjs > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then echo "::error::the release notes came out empty"; exit 1; fi
          gh release create "engine-v$VERSION" bundle/pixel-engine.zip --target "$GITHUB_SHA" \
            --title "Pixel Engine $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest
      - name: Open an issue when the release failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Release engine-v$VERSION failed"
          if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            # the label may not exist yet (scripts/configure-github.sh makes it), as revert-red-main.sh knows
            gh label create claude --color 5319e7 --description "Work for Claude" 2>/dev/null || true
            gh issue create --title "$title" --label claude \
              --body "CI's release job failed on $BASE at ${GITHUB_SHA:0:7}: $RUN_URL. The next run on $BASE tries again; close this once the release is out."
          fi
